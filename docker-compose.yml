services:
  claude:
    build:
      context: .
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
        USERNAME: "${CONTAINER_USER:-claude}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    image: claude-code:local
    init: true
    stdin_open: true
    tty: true
    working_dir: ${WORKSPACE_HOST_DIR:-$HOME/workspace}
    environment:
      HOME: /home/${CONTAINER_USER:-claude}
      CLAUDE_CONFIG_DIR: /config
      TERM: xterm-256color
      TZ: "${TZ:-UTC}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    env_file:
      - ${CLAUDE_DOCKER_CONFIG_DIR:-$HOME/.claude-docker}/claude.env
    volumes:
      # 容器内保持与宿主机相同的绝对路径，复用 .claude.json 中的项目信任记录
      - ${WORKSPACE_HOST_DIR:-$HOME/workspace}:${WORKSPACE_HOST_DIR:-$HOME/workspace}
      # 容器专用配置目录，不影响宿主机 ~/.claude
      - ${CLAUDE_DOCKER_CONFIG_DIR:-$HOME/.claude-docker}:/config
      # 只读复用宿主机用户级配置
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}:/host-claude:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/skills:/config/skills:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/agents:/config/agents:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/commands:/config/commands:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/output-styles:/config/output-styles:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/rules:/config/rules:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/themes:/config/themes:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/workflows:/config/workflows:ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/routines:/config/routines:ro
      # 插件需要缓存写入，保持读写；如只读加载可改为 :ro
      - ${HOST_CLAUDE_DIR:-$HOME/.claude}/plugins:/config/plugins
      # 可选：复用宿主机 git 配置
      # - ${HOME}/.gitconfig:/home/${CONTAINER_USER:-claude}/.gitconfig:ro
    extra_hosts:
      # Linux 下允许容器使用 http://host.docker.internal:PORT 访问宿主机代理
      - "host.docker.internal:host-gateway"
